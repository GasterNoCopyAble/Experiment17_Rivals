name: Fix Rivals Music Syntax

on:
  push:
    paths:
      - '.github/workflows/fix-music-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated table closer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Music.lua')
          s = p.read_text(encoding='utf-8')
          bad = '        error = nil\n    }\n    }\n\n    local probeFolder = "Experiment17_FS_TEST"'
          good = '        error = nil\n    }\n\n    local probeFolder = "Experiment17_FS_TEST"'
          if bad not in s:
              raise SystemExit('duplicated closer sequence not found')
          s = s.replace(bad, good, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Experiment17 Module Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Music.lua
          git commit -m "Fix Music.lua duplicated table closer"
          git push origin HEAD:main
