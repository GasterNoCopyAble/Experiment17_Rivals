name: Migrate actual Rivals modules

on:
  push:
    paths:
      - '.github/workflows/migrate-rivals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build logical modules
        run: python3 migration/build.py
      - name: Commit generated modules
        run: |
          git config user.name "Experiment17 Module Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace old build with actual Rivals logical modules"
          git push origin HEAD:main
