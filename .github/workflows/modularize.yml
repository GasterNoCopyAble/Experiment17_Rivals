name: Experiment17 Physical Modules

on:
  push:
    paths:
      - 'tools/modularize.py'
      - '.github/workflows/modularize.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate logical modules
        run: python3 tools/modularize.py

      - name: Commit generated modules
        run: |
          git config user.name "Experiment17 Module Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Refactor Experiment17 into physical logical modules"
          git push origin HEAD:main
